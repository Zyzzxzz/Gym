:root{
  --page:#EEF1F4; --surface:#FFFFFF; --ink:#1B2430; --muted:#5B6878; --line:#D5DBE2;
  --primary:#1F2A37; --primary-ink:#F5F7FA;
  --block:#1F2A37; --block-ink:#F5F7FA; --block-sub:rgba(245,247,250,.7);
  --field:#FFFFFF; --key:#EEF1F4; --danger:#B3261E; --scrim:rgba(15,22,30,.5);
  --tS:#D8342B; --tA:#2563C9; --tB:#F2B705; --tC:#23824A;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#17212B; --surface:#1F2B37; --ink:#EEF2F6; --muted:#9AA8B7; --line:#2E3C4B;
    --primary:#F5F7FA; --primary-ink:#17212B;
    --block:#2A3A4A; --block-ink:#F5F7FA;
    --field:#17212B; --key:#2A3A4A; --danger:#FF8A80; --scrim:rgba(0,0,0,.6);
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:400 17px/1.42 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html.locked body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button,a{touch-action:manipulation}
button{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
a{color:inherit}
p{margin:0 0 10px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.2px}
h2{font-size:23px;line-height:1.1;margin-bottom:8px}
h3{font-size:19px;line-height:1.15;margin:14px 0 6px}
section{margin:0 0 24px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0;pointer-events:none}

/* ---- frame ---- */
.shell{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--page);padding-top:env(safe-area-inset-top)}
.top-row{display:flex;align-items:center;gap:2px;padding:8px 16px 8px}
.top h1{flex:1;font-size:29px;line-height:1.05;min-width:0}
.top.root .top-row{align-items:baseline;padding-top:16px}
.top.root h1{font-size:42px}
.top-sub{color:var(--muted);font-size:15px;font-weight:600;white-space:nowrap}
.back{flex:none;width:44px;height:44px;margin:0 2px 0 -12px;border:0;background:none;display:grid;place-items:center;border-radius:12px}
main{flex:1;padding:8px 16px 28px}
.with-tabs main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.foot{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot p{margin:0 0 8px;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{position:relative;flex:1;max-width:104px;height:60px;padding:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:3px;background:var(--ink);border-radius:0 0 3px 3px}

.demo{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--primary);color:var(--primary-ink);font-size:13.5px;font-weight:600;line-height:1.3;padding:8px 16px}
.demo button{flex:none;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:6px 10px;font-weight:700}

/* ---- lists and rows ---- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 12px 10px 14px;border:0;background:none;text-align:left;text-decoration:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font:600 22px/1.12 var(--display);letter-spacing:.2px}
.row-sub{font-size:14px;line-height:1.3;color:var(--muted)}
.row-sub.strong{color:var(--ink);font-size:15px}
.row .go,.xhead .go{flex:none;color:var(--muted)}
.row .tick{flex:none}
.row.sel{background:var(--page)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-head h2{margin:0}
.sec-head span{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.lede{color:var(--muted);margin-bottom:16px}
.sub{margin:-4px 0 8px;font-size:15px}
.pill{display:inline-block;vertical-align:2px;margin-left:6px;font:700 12px/1 var(--body);padding:4px 7px;border-radius:6px;background:var(--primary);color:var(--primary-ink);letter-spacing:0}
.count{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font:700 18px/1 var(--display);color:var(--ink)}
.item.done .count{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.item.done .row-title{color:var(--muted)}
.hint{flex:none;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-set{display:inline-flex;align-items:baseline;gap:3px;font:600 21px/1 var(--display);padding:6px 9px;border-radius:9px;background:var(--page);border:1px solid var(--line)}
.chip-set b{font-weight:700}
.chip-set i{font-style:normal;font-size:16px;color:var(--muted)}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:8px 18px;border-radius:14px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);font:700 23px/1.05 var(--display);letter-spacing:.3px;text-align:center;text-decoration:none}
.btn:active:not(:disabled),.key:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.big{min-height:68px;font-size:29px}
.btn.sm{min-height:46px;font-size:20px;padding:6px 14px}
.btn.danger{color:var(--danger)}
.stack{display:grid;gap:10px;margin-bottom:14px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1;width:auto}
.link{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border:0;background:none;color:var(--ink);font-weight:600;font-size:16px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted);text-align:left}
.link.quiet{color:var(--muted);font-size:14px;font-weight:500;margin-top:8px}
.links{display:flex;flex-wrap:wrap;gap:4px 22px;margin:6px 0 4px}

/* ---- Log home ---- */
.start .btn{margin-bottom:8px}
.start p{margin-bottom:20px}
.notice{background:var(--surface);border:1px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:18px}
.notice.warn{border-color:var(--danger)}
.notice p:last-child{margin-bottom:0}
.notice .btn{margin-top:10px}
.qrcard{display:flex;gap:14px;align-items:flex-start;border-color:var(--line)}
.qr{flex:none;width:132px;height:132px;border-radius:8px}

/* ---- workouts ---- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:14px}
.seg button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 25px/1 var(--display);display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:15px}
.seg button small{font:600 13px/1 var(--body);color:var(--muted)}
.seg button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.seg button.on small{color:inherit;opacity:.75}
.seg.two button{font-size:21px;padding-top:0;align-items:center}
.wrow{display:flex;align-items:stretch}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:11px 8px 11px 14px;border:0;background:none;text-align:left}
.mini{flex:none;align-self:center;margin-right:10px;min-width:68px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--page);font-size:14px;font-weight:700}
.est{margin:10px 2px 22px;font-weight:600}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.leftout{margin-top:10px;font-size:14px}
ul.plain{margin:0 0 10px;padding-left:20px}
ul.plain li{margin-bottom:6px}

/* ---- logging ---- */
.cue-top{font-size:15.5px;line-height:1.4;color:var(--muted);margin:-2px 0 14px}
.last{background:var(--block);color:var(--block-ink);border-radius:14px;padding:12px 16px 14px;margin-bottom:12px}
.last .sec-head{margin-bottom:6px}
.last .sec-head span{color:var(--block-sub)}
.last .chips{gap:4px 24px}
.last .chip-set{font-size:34px;padding:0;background:none;border:0;gap:4px}
.last .chip-set i{color:var(--block-sub);font-size:21px}
.last.none{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.last.none p{margin:0;color:var(--muted);font-size:15.5px}
.nudge{margin:10px 0 0;font-weight:600;font-size:15px}
.target{font-size:15px;font-weight:600;margin:0 2px 16px}
.restbar{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;height:54px;padding:0 16px;margin:0 0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden;font:700 24px/1 var(--display)}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:var(--line)}
.rest-text,.rest-num{position:relative}
.restbar.up{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.nextup{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:10px 12px 10px 14px;margin-bottom:12px;border-radius:12px;border:1px solid var(--ink);background:var(--surface);text-align:left;font-size:16px}
.stp{margin-bottom:10px}
.stp-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:13px;font-weight:600;color:var(--muted)}
.stp-label span{font-weight:500}
.stp-row{display:grid;grid-template-columns:78px 1fr 78px;gap:8px}
.key{height:62px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--key);font:700 27px/1 var(--display)}
.readout{width:100%;height:62px;padding:0 8px;border:2px solid var(--ink);border-radius:12px;background:var(--field);color:var(--ink);font:700 42px/1 var(--display);letter-spacing:.5px;text-align:center;-webkit-appearance:none;appearance:none}
.readout::placeholder{color:var(--muted);opacity:.45}
.readout:focus{outline:3px solid var(--muted);outline-offset:2px}
@media (max-height:700px){
  .stp-row{grid-template-columns:64px 1fr 64px}
  .key,.readout{height:50px}
  .readout{font-size:34px}
  .btn.big{min-height:56px;font-size:25px}
}

/* ---- guide ---- */
.disc{flex:none;position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 23px/1 var(--display)}
.disc::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5)}
.disc.sm{width:30px;height:30px;font-size:17px}
.disc.sm::after{inset:3px;border-width:1px}
.tS{--c:var(--tS)} .tA{--c:var(--tA)} .tC{--c:var(--tC)}
.tB{--c:var(--tB);color:#1B2430;box-shadow:inset 0 0 0 1.5px rgba(27,36,48,.42)}
.tB::after{border-color:rgba(27,36,48,.38)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.eq,.ev{display:inline-flex;align-items:center;gap:5px;font:600 12.5px/1 var(--body);padding:5px 8px;border-radius:7px;border:1px solid var(--line);white-space:nowrap}
.eq{color:var(--muted)}
.ev{border-color:var(--muted);color:var(--ink)}
.ev i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.evR i{background:var(--ink)}
.evE i{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.evJ{border-style:dashed}
.legend{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;padding:12px 14px;margin-bottom:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.legend-q{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted)}
.note{background:var(--surface);border:1px dashed var(--muted);border-radius:12px;padding:10px 12px;font-size:15px}
.tier{margin-top:22px}
.tier-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tier-head h2{margin:0}
.tier-head p{margin:0;font-size:14px}
.xhead{display:flex;align-items:center;gap:10px;width:100%;padding:12px 12px 12px 14px;border:0;background:none;text-align:left}
.xhead .row-main{gap:6px}
.cue{font-size:14.5px;line-height:1.38;color:var(--muted)}
.xbody{padding:2px 14px 16px}
.why{margin:0 0 8px}
.focus{font-size:15px}
.evline{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.35;color:var(--muted)}
.evline .ev{flex:none;margin-top:1px}
.src{font-size:13.5px;line-height:1.4;color:var(--muted)}
.src a{display:block;margin-top:2px}
ul.swaps{list-style:none;margin:0;padding:0}
ul.swaps li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;border-top:1px solid var(--line)}
ul.swaps li:first-child{border-top:0}
.rank{display:flex;gap:12px;align-items:flex-start;padding:14px}
.rank .row-title{display:block;margin-bottom:4px}
.swapsec h3{margin-top:0;font-size:23px}

/* ---- history ---- */
.empty{padding:28px 0}
.empty .btn{margin-top:14px}
.chart svg{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:500 12px var(--body)}
.chart .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.chart .pt.sel{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.chart .val{fill:var(--ink);font:700 16px var(--display)}
.chart .hit{fill:transparent;cursor:pointer}
.readline{display:flex;justify-content:space-between;gap:12px;margin:10px 2px 4px;font-size:16px}
.readline span{font:700 21px/1.1 var(--display)}

/* ---- backup ---- */
.facts{margin-bottom:14px}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 14px;font-size:15.5px}
.fact span{color:var(--muted)}
.fact b{text-align:right}
ol.steps{margin:0 0 12px;padding:0;list-style:none;counter-reset:s}
ol.steps li{position:relative;counter-increment:s;padding:0 0 14px 44px;min-height:34px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-ink);font:700 18px/1 var(--display)}
.gate{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px}
.gate h1{font-size:36px;line-height:1.05;margin:16px 0 10px}
.gate .steps{margin-top:18px}
.gate .btn{margin-top:8px}
.gate-mark svg{display:block;width:64px;height:64px}

/* ---- sheets, fields, toast ---- */
.sheet-bg{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--page);border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.in{animation:up .18s ease-out}
.sheet h2{font-size:27px}
.sheet .list{margin-bottom:14px}
.sheet .key{background:var(--surface)}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.search input{width:100%;height:54px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat}
.search{display:block;margin-bottom:16px}
.blob{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font:16px/1.35 ui-monospace,Menlo,Consolas,monospace;margin-bottom:12px;resize:vertical}
.legend-list{display:grid;gap:12px;margin:10px 0 20px}
.legend-list>div{display:flex;gap:12px;align-items:center}
.legend-list p{margin:0;font-size:15px;line-height:1.35}
.legend-list .ev{flex:none;min-width:112px;justify-content:flex-start}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:30;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(92vw,480px);padding:12px 14px;border-radius:12px;background:var(--primary);color:var(--primary-ink);font-size:15px;font-weight:600;line-height:1.3;box-shadow:0 6px 24px rgba(0,0,0,.28);transform:translate(-50%,-180%);transition:transform .2s ease;pointer-events:none}
#toast.show{transform:translate(-50%,0);pointer-events:auto}
#toast button{flex:none;min-height:40px;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:8px 14px;font-weight:700}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

<div id="app"><noscript><p style="padding:24px">Gym Log needs JavaScript. Turn it on in your browser settings, then reload.</p></noscript></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate

    if (o.swapPrefs && typeof o.swapPrefs === 'object') s.swapPrefs = o.swapPrefs;
    if (o.rest && o.rest.until) s.rest = o.rest;
    Object.assign(s.prefs, o.prefs || {});
    Object.assign(s.meta, o.meta || {});
    return s;
  }

  /* Second copy of the logs, in the phone's database storage. Every call gives up after a short wait,
     so a stuck database can never stop the app from opening. */
  const IDB = {
    db: null,
    open() {
      return new Promise((res) => {
        let settled = false;
        const finish = (ok) => { if (!settled) { settled = true; res(ok); } };
        const timer = setTimeout(() => finish(false), 2000);
        try {
          const rq = indexedDB.open('gymlog', 1);
          rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
          rq.onsuccess = () => {
            clearTimeout(timer);
            const db = rq.result;
            db.onversionchange = () => { try { db.close(); } catch (e) { /* already closed */ } if (IDB.db === db) IDB.db = null; };
            db.onclose = () => { if (IDB.db === db) IDB.db = null; };
            IDB.db = db;
            const late = settled;
            finish(true);
            if (late) lateSync();
          };
          rq.onerror = () => { clearTimeout(timer); finish(false); };
        } catch (e) { clearTimeout(timer); finish(false); }
      });
    },
    get(k) {
      return new Promise((res) => {
        if (!IDB.db) return res(null);
        const timer = setTimeout(() => res(null), 2000);
        try {
          const rq = IDB.db.transaction('kv').objectStore('kv').get(k);
          rq.onsuccess = () => { clearTimeout(timer); res(rq.result || null); };
          rq.onerror = () => { clearTimeout(timer); res(null); };
        } catch (e) { clearTimeout(timer); res(null); }
      });
    },
    put(k, v, retried) {
      return new Promise((res) => {
        let settled = false;
        const fail = () => {
          if (settled) return;
          settled = true;
          if (retried) { res(false); return; }
          /* The phone can drop the database link while the app sleeps: reopen once and try again. */
          IDB.db = null;
          IDB.open().then((ok) => { if (ok) IDB.put(k, v, true).then(res); else res(false); });
        };
        if (!IDB.db) { fail(); return; }
        try {
          const tx = IDB.db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(v, k);
          tx.oncomplete = () => { if (!settled) { settled = true; res(true); } };
          tx.onerror = fail;
          tx.onabort = fail;
        } catch (e) { fail(); }
      });
    }
  };
  /* The database answered after the app had already started without it: fold its copy in, lose nothing. */
  async function lateSync() {
    if (MODE !== 'app' || !S) return;
    const other = parse(await IDB.get(KEY));
    HEALTH.idb = true;
    if (other) {
      const r = mergeBackup(other);
      if (r.added || r.updated) { save(); render(); return; }
    }
    writeOut();
  }

  function writeOut() {
    const raw = JSON.stringify(S);
    let ok = false;
    try { localStorage.setItem(KEY, raw); ok = true; } catch (e) { ok = false; }
    HEALTH.ls = ok;
    IDB.put(KEY, raw).then((done) => {
      HEALTH.idb = done;
      const bad = !ok && !done;
      if (bad !== HEALTH.problem) { HEALTH.problem = bad; render(); }
    });
  }
  function save() {
    IDX = null;
    if (MODE !== 'app') return;
    S.rev++;
    writeOut();
  }

  async function loadSaved() {
    let lsRaw = null;
    try { lsRaw = localStorage.getItem(KEY); HEALTH.ls = true; } catch (e) { HEALTH.ls = false; }
    HEALTH.idb = await IDB.open();
    const idbRaw = HEALTH.idb ? await IDB.get(KEY) : null;
    const a = parse(lsRaw);
    const b = parse(idbRaw);
    let pick = a && b ? (b.rev > a.rev ? b : a) : (a || b);
    if (!pick) {
      /* Stored text exists but cannot be read: set it aside instead of writing over it. */
      const bad = lsRaw || idbRaw;
      if (bad) {
        HEALTH.corrupt = true;
        const k = KEY + '.unreadable.' + Date.now();
        try { localStorage.setItem(k, bad); } catch (e) { /* keep going */ }
        IDB.put(k, bad);
      }
      pick = fresh();
    }
    S = pick;
    IDX = null;
    if (S.plan && S.plan.d !== today()) S.plan = null;
    writeOut();
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then((p) => { HEALTH.persisted = !!p; }, () => {});
    } catch (e) { /* not supported */ }
  }

  function demoState() {
    const s = fresh();
    const items = D.workoutPlan(D.WORKOUTS[0], 45);
    const base = { leg_press: 140, machine_chest_press: 70, lat_pulldown: 80, seated_leg_curl: 60, seated_cable_row: 70, db_lateral_raise: 10, cable_crunch: 50 };
    [13, 10, 6, 3].forEach((back, k) => {
      const day = new Date(Date.now() - back * 86400000);
      day.setHours(14, 5, 0, 0);
      let t = day.getTime();
      items.forEach((it) => {
        for (let i = 0; i < it.sets; i++) {
          const w = it.ex === 'db_lateral_raise' ? (k >= 2 ? 12.5 : 10) : (base[it.ex] || 50) + k * 5;
          const r = Math.max(6, topRep(it.reps) - 1 - i - (k % 2));
          s.entries.push({ id: 'demo-' + k + '-' + it.ex + '-' + i, ex: it.ex, w, r, t, d: ymd(t), m: t });
          t += (it.rest + 40) * 1000;
        }
      });
    });
    return s;
  }

  /* ------------------------------------------------------------------ derived data */
  const cmpEntry = (a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : (a.t - b.t) || (a.id < b.id ? -1 : 1));
  function index() {
    if (IDX) return IDX;
    const by = {}, days = {};
    S.entries.slice().sort(cmpEntry).forEach((e) => {
      (by[e.ex] || (by[e.ex] = [])).push(e);
      (days[e.d] || (days[e.d] = [])).push(e);
    });
    return (IDX = { by, days });
  }
  function sessions(ex) {
    const out = [];
    let cur = null;
    (index().by[ex] || []).forEach((e) => {
      if (!cur || cur.d !== e.d) { cur = { d: e.d, sets: [] }; out.push(cur); }
      cur.sets.push(e);
    });
    return out;
  }
  function exInfo(id) {
    if (D.EX[id]) return D.EX[id];
    const c = S.custom.find((x) => x.id === id);
    if (c) return { n: c.name, eq: 'own', p: c.group ? [c.group] : [], s: [], cue: '', sw: [], bw: 1, custom: 1 };
    return { n: 'Removed exercise', eq: 'own', p: [], s: [], cue: '', sw: [], bw: 1, missing: 1 };
  }
  const exName = (id) => exInfo(id).n;
  const eqName = (eq) => D.EQUIP[eq] || 'My own';
  const groupName = (id) => { const g = D.GROUPS.find((x) => x.id === id); return g ? g.name : ''; };
  const workout = (id) => D.WORKOUTS.find((w) => w.id === id);
  const planItem = (ex) => (S.plan ? S.plan.items.find((it) => it.ex === ex) : null);
  const topSet = (sets) => sets.reduce((a, e) => (e.w > a.w || (e.w === a.w && e.r > a.r) ? e : a), sets[0]);
  const repsWord = (info) => (info.timed ? 'seconds' : 'reps');

  function setLong(e) {
    const info = exInfo(e.ex);
    return (e.w ? fmtW(e.w) + ' lb' : 'Bodyweight') + ' × ' + e.r + (info.timed ? ' sec' : '');
  }
  function setChip(e) {
    const info = exInfo(e.ex);
    return `<span class="chip-set"><b>${e.w ? fmtW(e.w) : 'BW'}</b><i>×</i>${e.r}${info.timed ? 's' : ''}</span>`;
  }

  /* What to pre-fill for the next set of an exercise. */
  function suggest(ex) {
    const ss = sessions(ex);
    const t = today();
    const cur = ss.find((s) => s.d === t);
    const todaySets = cur ? cur.sets : [];
    let prev = null;
    for (let i = ss.length - 1; i >= 0; i--) { if (ss[i].d < t) { prev = ss[i]; break; } }
    const n = todaySets.length;
    const item = planItem(ex);
    const info = exInfo(ex);
    let w = 0, r;
    if (n) w = todaySets[n - 1].w; else if (prev) w = prev.sets[0].w;
    if (prev && prev.sets[n]) r = prev.sets[n].r;
    else if (n) r = todaySets[n - 1].r;
    else if (prev) r = prev.sets[prev.sets.length - 1].r;
    else r = info.timed ? 30 : (item ? lowRep(item.reps) : 10);
    return { w, r, n, prev, todaySets, item };
  }

  function timeFor(w) {
    const want = S.prefs.time || 45;
    let best = w.times[0];
    w.times.forEach((t) => { if (t <= want) best = t; });
    return best;
  }
  function plannedItems(w, time) {
    return D.workoutPlan(w, time).map((it) => {
      const pref = S.swapPrefs[it.ex];
      const ex = pref && D.EX[it.ex].sw.indexOf(pref) >= 0 ? pref : it.ex;
      return { ex, orig: it.ex, sets: it.sets, reps: D.EX[ex].timed ? '30–40' : it.reps, rest: it.rest };
    });
  }
  function coverage(items) {
    const direct = {}, helps = {};
    items.forEach((it) => { const e = exInfo(it.ex); e.p.forEach((m) => { direct[m] = 1; }); (e.s || []).forEach((m) => { helps[m] = 1; }); });
    return {
      direct: D.GROUPS.filter((g) => direct[g.id]),
      helps: D.GROUPS.filter((g) => !direct[g.id] && helps[g.id])
    };
  }
  function recentExercises(n) {
    const seen = [];
    const list = S.entries.slice().sort(cmpEntry);
    for (let i = list.length - 1; i >= 0 && seen.length < n; i--) { if (seen.indexOf(list[i].ex) < 0) seen.push(list[i].ex); }
    return seen;
  }
  const unsaved = () => S.entries.filter((e) => e.m > (S.meta.lastBackupAt || 0)).length;

  /* ------------------------------------------------------------------ navigation */
  const NAV = { tab: 'log', stack: [] };
  const SCROLL = [];
  let HIST = !ENV.embedded && !!(window.history && history.pushState);
  const topPage = () => { for (let i = NAV.stack.length - 1; i >= 0; i--) { if (!NAV.stack[i].sheet) return NAV.stack[i]; } return null; };
  const topSheet = () => { const t = NAV.stack[NAV.stack.length - 1]; return t && t.sheet ? t : null; };

  function push(page, how) {
    SCROLL[NAV.stack.length] = window.scrollY;
    NAV.stack.push(page);
    if (HIST) { try { history.pushState({ d: NAV.stack.length }, ''); } catch (e) { HIST = false; } }
    render(how || 'new');
  }
  function openSheet(page) {
    page.sheet = true;
    page.fresh = true;
    if (topSheet()) { NAV.stack[NAV.stack.length - 1] = page; render(); } else push(page, 'keep');
  }
  function popLocal() {
    NAV.stack.pop();
    while (NAV.stack.length && NAV.stack[NAV.stack.length - 1].used) NAV.stack.pop();
    render('back');
  }
  function back() {
    if (!NAV.stack.length) return;
    if (HIST) history.back(); else popLocal();
  }
  window.addEventListener('popstate', (e) => {
    if (!S) return;
    const d = (e.state && e.state.d) || 0;
    while (NAV.stack.length > d) NAV.stack.pop();
    const top = NAV.stack[NAV.stack.length - 1];
    if (top && top.used) { history.back(); return; }
    render('back');
  });

  /* ------------------------------------------------------------------ toast */
  let TOAST_FN = null;
  let toastTimer = null;
  function hideToast() { const el = document.getElementById('toast'); if (el) el.className = ''; TOAST_FN = null; clearTimeout(toastTimer); }
  function toast(msg, action) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.innerHTML = `<span>${h(msg)}</span>` + (action ? `<button data-act="toast-act">${h(action.label)}</button>` : '');
    TOAST_FN = action ? action.fn : null;
    void el.offsetWidth;
    el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 7000 : 2800);
  }

  /* ------------------------------------------------------------------ small pieces of screen */
  const disc = (t, small) => `<span class="disc t${t}${small ? ' sm' : ''}" role="img" aria-label="Tier ${t}, ${D.TIERS[t].word.toLowerCase()}">${t}</span>`;
  const evTag = (k) => `<span class="ev ev${k}"><i></i>${D.EVIDENCE[k].tag}</span>`;
  const eqTag = (eq) => `<span class="eq">${eqName(eq)}</span>`;
  const demoLink = (name) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name.replace(/\s*\(.*?\)/g, '') + ' proper form');

  function stepper(id, key, label, hint, value, delta, mode) {
    return `<div class="stp">
      <div class="stp-label"><label for="${id}">${label}</label>${hint ? `<span>${hint}</span>` : ''}</div>
      <div class="stp-row">
        <button class="key" data-act="step" data-step="${id}" data-delta="-${delta}" aria-label="${label}: minus ${delta}">−${delta}</button>
        <input id="${id}" class="readout" data-in="${key}" inputmode="${mode}" autocomplete="off" enterkeyhint="done" value="${h(value)}" placeholder="0" aria-label="${label}">
        <button class="key" data-act="step" data-step="${id}" data-delta="${delta}" aria-label="${label}: plus ${delta}">+${delta}</button>
      </div>
    </div>`;
  }

  function tabBar() {
    const tabs = [['log', 'Log'], ['workouts', 'Workouts'], ['guide', 'Exercises'], ['history', 'History'], ['backup', 'Backup']];
    return `<nav class="tabs" aria-label="Sections">${tabs.map(([id, label]) => `<button class="tab${NAV.tab === id ? ' on' : ''}" data-act="tab" data-tab="${id}"${NAV.tab === id ? ' aria-current="page"' : ''}>${IC[id]}<span>${label}</span></button>`).join('')}</nav>`;
  }

  /* ------------------------------------------------------------------ screen: Log (home) */
  function homeNotices() {
    let b = '';
    if (HEALTH.corrupt) b += `<div class="notice warn"><p><b>Stored logs could not be read.</b> They were set aside, not deleted. Restore from your latest backup on the Backup tab.</p></div>`;
    if (HEALTH.problem) b += `<div class="notice warn"><p><b>The last change could not be saved on this device.</b> Back up now, then close and reopen the app.</p><button class="btn sm" data-act="export">Back up now</button></div>`;
    if (MODE === 'app' && S.entries.length && Date.now() > (S.meta.snoozeUntil || 0)) {
      const n = unsaved();
      const last = S.meta.lastBackupAt || 0;
      const days = last ? Math.floor((Date.now() - last) / 86400000) : 9999;
      if (n >= 30 || (n > 0 && days >= 7 && last) || (!last && n >= 12)) {
        b += `<div class="notice"><p><b>${plural(n, 'set')} not in a backup yet.</b> A backup is the only copy outside this ${ENV.ios ? 'iPhone' : 'device'}.</p><div class="btnrow"><button class="btn sm" data-act="export">Back up now</button><button class="btn sm ghost" data-act="backup-later">Later</button></div></div>`;
      }
    }
    if (MODE === 'app' && !ENV.ios && !ENV.android && ENV.web && !S.prefs.hideQR) {
      const url = location.origin + location.pathname;
      const qr = qrSVG(url);
      b += `<div class="notice qrcard">${qr}<div><p><b>Open this on your iPhone.</b> Point the iPhone camera at the code, tap the link, then follow the steps on screen.</p><p class="muted">Logs made on this computer stay on this computer.</p><button class="btn sm ghost" data-act="hide-qr">Hide this</button></div></div>`;
    }
    return b;
  }
  function qrSVG(text) {
    try {
      if (typeof qrcode !== 'function') return '';
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount();
      let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + 2},${r + 2}h1v1h-1z`;
      return `<svg class="qr" viewBox="0 0 ${n + 4} ${n + 4}" role="img" aria-label="QR code with this app's address"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    } catch (e) { return ''; }
  }

  function viewHome() {
    const t = today();
    const todays = index().days[t] || [];
    const order = [];
    todays.forEach((e) => { if (order.indexOf(e.ex) < 0) order.push(e.ex); });
    const count = (ex) => todays.filter((e) => e.ex === ex).length;
    const todayRow = (ex) => `<button class="row" data-act="open-log" data-ex="${h(ex)}"><span class="row-main"><span class="row-title">${h(exName(ex))}</span><span class="chips">${todays.filter((e) => e.ex === ex).map(setChip).join('')}</span></span>${IC.go}</button>`;
    let b = homeNotices();
    const plan = S.plan;
    if (plan) {
      let total = 0, done = 0;
      plan.items.forEach((it) => { total += it.sets; done += Math.min(it.sets, count(it.ex)); });
      const all = total > 0 && done >= total;
      b += `<section><div class="sec-head"><h2>${h(plan.title)}</h2><span class="muted">${done} of ${total} sets</span></div><div class="list">`;
      b += plan.items.map((it) => {
        const n = count(it.ex);
        const fin = n >= it.sets;
        const info = exInfo(it.ex);
        return `<button class="row item${fin ? ' done' : ''}" data-act="open-log" data-ex="${h(it.ex)}"><span class="count" aria-label="${n} of ${it.sets} sets done">${fin ? IC.check : n + '/' + it.sets}</span><span class="row-main"><span class="row-title">${h(info.n)}</span><span class="row-sub">${plural(it.sets, 'set')} of ${it.reps} ${repsWord(info)}</span></span>${IC.go}</button>`;
      }).join('');
      b += `</div></section>`;
      const extra = order.filter((ex) => !plan.items.some((it) => it.ex === ex));
      if (extra.length) b += `<section><h2>Also logged today</h2><div class="list">${extra.map(todayRow).join('')}</div></section>`;
      b += `<div class="stack"><button class="btn ghost" data-act="picker">Add an exercise</button><button class="btn${all ? '' : ' ghost'}" data-act="finish">Finish workout</button></div>`;
    } else if (order.length) {
      b += `<section><h2>Logged today</h2><div class="list">${order.map(todayRow).join('')}</div></section>`;
      b += `<div class="stack"><button class="btn" data-act="picker">Log another exercise</button><button class="btn ghost" data-act="go-workouts">Pick a workout</button></div>`;
    } else {
      b += `<section class="start"><h2>Start here</h2>
        <button class="btn big" data-act="go-workouts">Pick a workout</button>
        <p class="muted">Ready-made workouts for 30 to 90 minutes.${S.entries.length ? '' : ' New to this? Choose Full body, then tap Start.'}</p>
        <button class="btn big ghost" data-act="picker">Log one exercise</button>
        <p class="muted">Choose any exercise and record your sets.</p>
      </section>`;
    }
    return { title: 'Log', sub: fmtDay(t), body: b };
  }

  /* ------------------------------------------------------------------ screen: Workouts */
  function viewWorkouts() {
    const first = !S.entries.length;
    let b = `<p class="lede">Each workout comes in 30, 45 and 60 minute versions. Full body also has 90.</p>`;
    D.SPLITS.forEach((sp, i) => {
      b += `<section><h2>${h(sp.name)}</h2><p class="muted sub">${h(sp.line)}</p><div class="list">`;
      b += sp.workouts.map((id) => {
        const w = workout(id);
        const names = w.covers.map(groupName).join(', ');
        const covers = w.covers.length === D.GROUPS.length ? 'Every muscle group' : names.charAt(0) + names.slice(1).toLowerCase();
        return `<button class="row" data-act="workout" data-id="${id}"><span class="row-main"><span class="row-title">${h(w.name)}${first && i === 0 ? ' <span class="pill">Start here</span>' : ''}</span><span class="row-sub">${h(covers)}</span></span>${IC.go}</button>`;
      }).join('');
      b += `</div></section>`;
    });
    b += `<p class="muted">Pick one way to split and take its workouts in turn, on whatever days suit you.</p>`;
    return { title: 'Workouts', body: b };
  }

  function viewWorkout(p) {
    const w = workout(p.id);
    const time = timeFor(w);
    const items = plannedItems(w, time);
    const est = Math.round(D.estimateMinutes(items));
    const cov = coverage(items);
    const touched = cov.direct.concat(cov.helps).map((g) => g.id);
    const left = w.covers.filter((m) => touched.indexOf(m) < 0);
    const lower = (list) => list.join(', ').toLowerCase();
    let b = `<div class="seg" role="group" aria-label="Workout length">${w.times.map((t) => `<button class="${t === time ? 'on' : ''}" data-act="time" data-t="${t}" aria-pressed="${t === time}">${t}<small>min</small></button>`).join('')}</div>`;
    b += `<div class="list">${items.map((it) => {
      const info = exInfo(it.ex);
      return `<div class="wrow"><button class="wmain" data-act="exinfo" data-ex="${it.ex}"><span class="row-title">${h(info.n)}</span><span class="row-sub">${plural(it.sets, 'set')} of ${it.reps} ${repsWord(info)}, rest ${restText(it.rest)}${it.ex !== it.orig ? '. In place of ' + h(exName(it.orig)) + '.' : ''}</span></button><button class="mini" data-act="swap" data-ctx="workout" data-orig="${it.orig}">Swap</button></div>`;
    }).join('')}</div>`;
    b += `<p class="est">About ${est} minutes, with a short warm-up.</p>`;
    b += `<section><h2>Trains directly</h2><div class="mchips">${cov.direct.map((g) => `<span class="mchip">${g.name}</span>`).join('')}</div>`;
    if (cov.helps.length) b += `<p class="muted leftout">Also worked, as helpers: ${lower(cov.helps.map((g) => g.name))}.</p>`;
    if (left.length) b += `<p class="muted leftout">Left out at this length: ${lower(left.map(groupName))}.</p>`;
    b += `</section>`;
    b += `<section><h2>How to use the numbers</h2><ul class="plain">
      <li>Warm up with 1 or 2 lighter sets of the first exercise. Don't log those.</li>
      <li>Pick a weight that makes the last reps hard, with 1 or 2 left in you.</li>
      <li>When you reach the top of the rep range on every set, add weight next time.</li>
    </ul><p class="muted">The sets, reps and rest times are my judgment, based on common coaching practice.</p></section>`;
    const again = S.plan ? `<p class="muted center">This replaces today's workout. Sets you already logged stay saved.</p>` : '';
    return { title: w.name, body: b, foot: again + `<button class="btn big" data-act="start">Start this workout</button>` };
  }

  /* ------------------------------------------------------------------ screen: logging one exercise */
  function viewLog(p) {
    const ex = p.ex;
    const info = exInfo(ex);
    const sg = suggest(ex);
    const item = sg.item;
    if (!UI.log || UI.log.ex !== ex) UI.log = { ex, w: sg.w ? fmtW(sg.w) : '', r: String(sg.r) };
    const n = sg.todaySets.length;
    let b = '';
    if (info.cue && (n === 0 || UI.cue)) b += `<p class="cue-top">${h(info.cue)}</p>`;
    if (sg.prev) {
      let nudge = '';
      if (item && !info.timed && sg.prev.sets.length >= item.sets && sg.prev.sets.every((e) => e.r >= topRep(item.reps))) nudge = `<p class="nudge">You reached ${topRep(item.reps)} on every set. Add a little weight today.</p>`;
      b += `<section class="last"><div class="sec-head"><h2>Last time</h2><span>${fmtDay(sg.prev.d)}, ${ago(sg.prev.d)}</span></div><div class="chips">${sg.prev.sets.map(setChip).join('')}</div>${nudge}</section>`;
    } else {
      b += `<section class="last none"><div class="sec-head"><h2>Last time</h2></div><p>Nothing logged yet. Start light: a weight you can lift ${item ? item.reps : '8–12'} times with good form.</p></section>`;
    }
    if (item) b += `<p class="target">Plan: ${plural(item.sets, 'set')} of ${item.reps} ${repsWord(info)}, ${restText(item.rest)} rest.</p>`;
    b += `<div id="rest" aria-live="off"></div><section><h2>Today</h2>`;
    if (n) {
      b += `<div class="list">${sg.todaySets.map((e, i) => `<button class="row set" data-act="edit" data-id="${h(e.id)}"><span class="count">${i + 1}</span><span class="row-main"><span class="row-title">${h(setLong(e))}</span></span><span class="hint">Edit</span></button>`).join('')}</div>`;
    } else {
      b += `<p class="muted">No sets yet. Set the weight and ${repsWord(info)} below, then tap Log set.</p>`;
    }
    b += `</section>`;
    if (item && n >= item.sets && S.plan) {
      const todays = index().days[today()] || [];
      const next = S.plan.items.find((it) => it.ex !== ex && todays.filter((e) => e.ex === it.ex).length < it.sets);
      b += next
        ? `<button class="nextup" data-act="next" data-ex="${h(next.ex)}"><span><b>All ${plural(item.sets, 'set')} done.</b> Next: ${h(exName(next.ex))}</span>${IC.go}</button>`
        : `<button class="nextup" data-act="back"><span><b>All ${plural(item.sets, 'set')} done.</b> That was the last exercise.</span>${IC.go}</button>`;
    }
    const idx = S.plan ? S.plan.items.indexOf(item) : -1;
    b += `<div class="links">`;
    if (info.cue && n > 0 && !UI.cue) b += `<button class="link" data-act="cue">Form tip</button>`;
    if (item && idx >= 0 && exInfo(item.orig || item.ex).sw.length) b += `<button class="link" data-act="swap" data-ctx="plan" data-idx="${idx}" data-orig="${h(item.orig || item.ex)}">Swap exercise</button>`;
    if (sessions(ex).length) b += `<button class="link" data-act="exhist" data-ex="${h(ex)}">History</button>`;
    if (!info.custom && !info.missing) b += `<a class="link" href="${demoLink(info.n)}" target="_blank" rel="noopener">Watch a demo</a>`;
    b += `</div>`;
    const wHint = info.eq === 'dumbbell' ? 'each dumbbell' : (info.bw ? 'leave empty for bodyweight' : (UI.log.w ? '' : 'tap the number to type it'));
    const foot = stepper('in-w', 'log-w', 'Weight, lb', wHint, UI.log.w, 5, 'decimal')
      + stepper('in-r', 'log-r', info.timed ? 'Seconds' : 'Reps', '', UI.log.r, info.timed ? 5 : 1, 'numeric')
      + `<button class="btn big" data-act="log-set">Log set ${n + 1}</button>`;
    return { title: info.n, body: b, foot };
  }

  let restTimer = null;
  function tickRest() {
    const el = document.getElementById('rest');
    const r = S && S.rest;
    const p = topPage();
    if (!el || !r || !p || p.name !== 'log' || p.ex !== r.ex) { if (el) el.innerHTML = ''; clearInterval(restTimer); restTimer = null; return; }
    const left = Math.ceil((r.until - Date.now()) / 1000);
    if (left < -180) { el.innerHTML = ''; clearInterval(restTimer); restTimer = null; return; }
    if (left > 0) {
      const pct = Math.max(0, Math.min(100, 100 * left / (r.total || 90)));
      el.innerHTML = `<button class="restbar" data-act="rest-clear" aria-label="Rest timer, ${left} seconds left. Tap to clear."><span class="rest-fill" style="width:${pct.toFixed(1)}%"></span><span class="rest-text">Rest</span><span class="rest-num">${Math.floor(left / 60)}:${pad(left % 60)}</span></button>`;
    } else {
      el.innerHTML = `<button class="restbar up" data-act="rest-clear" aria-label="Rest is over. Tap to clear."><span class="rest-text">Rest is over</span><span class="rest-num">Go</span></button>`;
    }
  }
  function startRest() {
    clearInterval(restTimer);
    restTimer = null;
    const p = topPage();
    if (p && p.name === 'log' && S.rest && S.rest.ex === p.ex) { tickRest(); restTimer = setInterval(tickRest, 1000); }
  }

  function bestNote(e, before) {
    if (!before.some((x) => x.d < e.d)) return '';
    const maxW = Math.max.apply(null, before.map((x) => x.w));
    if (e.w > maxW && e.w > 0) return 'Heaviest set yet on this exercise';
    const same = before.filter((x) => x.w === e.w);
    if (same.length && e.r > Math.max.apply(null, same.map((x) => x.r))) return e.w ? 'Most reps yet at ' + fmtW(e.w) + ' lb' : 'Most reps yet';
    return '';
  }

  /* ------------------------------------------------------------------ screen: exercise picker */
  function pickRow(id, tier) {
    const x = exInfo(id);
    return `<button class="row" data-act="pick-ex" data-ex="${h(id)}">${tier ? disc(tier, true) : ''}<span class="row-main"><span class="row-title">${h(x.n)}</span><span class="row-sub">${eqName(x.eq)}</span></span>${IC.go}</button>`;
  }
  function pickerResults() {
    const q = UI.q.trim().toLowerCase();
    if (q) {
      const words = q.split(/\s+/);
      const all = Object.keys(D.EX).concat(S.custom.map((c) => c.id));
      const hits = all.filter((id) => { const n = exName(id).toLowerCase(); return words.every((w) => n.indexOf(w) >= 0); })
        .sort((a, b) => exName(a).localeCompare(exName(b))).slice(0, 40);
      return (hits.length ? `<div class="list">${hits.map((id) => pickRow(id)).join('')}</div>` : `<p class="muted">No exercise matches that.</p>`)
        + `<button class="btn ghost" data-act="custom-new">Add “${h(UI.q.trim())}” as my own</button>`;
    }
    let b = '';
    const recent = recentExercises(6);
    if (recent.length) b += `<section><h2>Recent</h2><div class="list">${recent.map((id) => pickRow(id)).join('')}</div></section>`;
    b += `<section><h2>By muscle</h2><div class="list">${D.GROUPS.map((g) => `<button class="row" data-act="pgroup" data-id="${g.id}"><span class="row-main"><span class="row-title">${g.name}</span></span>${IC.go}</button>`).join('')}</div></section>`;
    if (S.custom.length) b += `<section><h2>My own</h2><div class="list">${S.custom.map((c) => pickRow(c.id)).join('')}</div></section>`;
    b += `<button class="btn ghost" data-act="custom-new">Add my own exercise</button>`;
    return b;
  }
  function viewPicker() {
    return {
      title: 'Choose an exercise',
      body: `<label class="search"><span class="vh">Search exercises</span><input type="search" data-in="q" value="${h(UI.q)}" placeholder="Search, for example: curl" autocomplete="off" autocapitalize="off" enterkeyhint="search"></label><div id="pick-results">${pickerResults()}</div>`
    };
  }
  function viewPGroup(p) {
    const rows = D.RANK[p.id].list;
    const own = S.custom.filter((c) => c.group === p.id);
    let b = `<p class="lede">Best picks first.</p><div class="list">${rows.map((r) => pickRow(r[0], r[1])).join('')}${own.map((c) => pickRow(c.id)).join('')}</div>`;
    b += `<button class="btn ghost" data-act="custom-new">Add my own exercise</button>`;
    return { title: groupName(p.id), body: b };
  }
  function pick(ex) {
    NAV.stack.forEach((pg) => { if (pg.name === 'picker' || pg.name === 'pgroup' || pg.name === 'custom') pg.used = true; });
    if (S.plan && !S.plan.items.some((it) => it.ex === ex)) {
      S.plan.items.push({ ex, orig: ex, sets: 3, reps: exInfo(ex).timed ? '30–40' : '8–12', rest: 90 });
      save();
    }
    UI.log = null;
    UI.cue = false;
    push({ name: 'log', ex });
  }

  /* ------------------------------------------------------------------ screen: Exercises (the guide) */
  const REGIONS = [
    { name: 'Upper body', ids: ['chest', 'upper_back', 'lats', 'front_delts', 'side_delts', 'rear_delts', 'biceps', 'triceps', 'forearms'] },
    { name: 'Lower body', ids: ['quads', 'hamstrings', 'glutes', 'calves'] },
    { name: 'Core', ids: ['abs', 'lower_back'] }
  ];
  function viewGuide() {
    let b = `<p class="lede">Exercises ranked for building muscle and strength. Pick a muscle.</p>`;
    REGIONS.forEach((rg) => {
      b += `<section><h2>${rg.name}</h2><div class="list">${rg.ids.map((id) => {
        const best = D.RANK[id].list.filter((r) => r[1] === 'S').map((r) => exName(r[0]));
        return `<button class="row" data-act="group" data-id="${id}"><span class="row-main"><span class="row-title">${groupName(id)}</span><span class="row-sub">Best: ${h(best.join(', '))}</span></span>${IC.go}</button>`;
      }).join('')}</div></section>`;
    });
    b += `<button class="btn ghost" data-act="legend">How the ranks and tags work</button>`;
    return { title: 'Exercises', body: b };
  }

  function sourceLinks(keys) {
    if (!keys || !keys.length) return '';
    return `<p class="src">${keys.length > 1 ? 'Sources' : 'Source'}: ${keys.map((k) => `<a href="${h(D.SOURCES[k].u)}" target="_blank" rel="noopener">${h(D.SOURCES[k].t)}</a>`).join(' ')}</p>`;
  }
  function swapList(ex) {
    const info = exInfo(ex);
    if (!info.sw.length) return '';
    return `<h3>If your gym doesn't have it</h3><ul class="swaps">${info.sw.map((id) => `<li><button class="link" data-act="exinfo" data-ex="${id}">${h(exName(id))}</button>${eqTag(exInfo(id).eq)}</li>`).join('')}</ul>`;
  }
  function exButtons(ex) {
    const info = exInfo(ex);
    return `<div class="btnrow"><button class="btn sm" data-act="open-log" data-ex="${h(ex)}">Log this</button>${sessions(ex).length ? `<button class="btn sm ghost" data-act="exhist" data-ex="${h(ex)}">History</button>` : ''}${info.custom || info.missing ? '' : `<a class="btn sm ghost" href="${demoLink(info.n)}" target="_blank" rel="noopener">Watch a demo</a>`}</div>`;
  }
  function rankDetail(row) {
    return `<p class="why">${h(row[3])}</p>${row[5] ? `<p class="focus"><b>To aim it here:</b> ${h(row[5])}</p>` : ''}<p class="evline">${evTag(row[2])}<span>${D.EVIDENCE[row[2]].line}</span></p>${sourceLinks(row[4])}`;
  }
  function viewGroup(p) {
    const g = D.RANK[p.id];
    const research = g.list.filter((r) => r[2] !== 'J').length;
    let b = `<button class="legend" data-act="legend"><span class="tags">${evTag('R')}${evTag('E')}${evTag('J')}</span><span class="legend-q">What these mean</span></button>`;
    b += research
      ? `<p class="muted">${research} of the ${g.list.length} rankings here rest on research. The rest are my judgment.</p>`
      : '';
    if (g.note) b += `<p class="note">${h(g.note)}</p>`;
    ['S', 'A', 'B', 'C'].forEach((t) => {
      const rows = g.list.filter((r) => r[1] === t);
      if (!rows.length) return;
      b += `<section class="tier"><div class="tier-head">${disc(t)}<div><h2>${D.TIERS[t].word}</h2><p class="muted">${D.TIERS[t].line}</p></div></div><div class="list">`;
      b += rows.map((r) => {
        const info = exInfo(r[0]);
        const open = UI.open === r[0];
        return `<div class="xrow${open ? ' open' : ''}"><button class="xhead" data-act="xtoggle" data-ex="${r[0]}" aria-expanded="${open}"><span class="row-main"><span class="row-title">${h(info.n)}</span><span class="tags">${eqTag(info.eq)}${evTag(r[2])}</span><span class="cue">${h(info.cue)}</span></span>${open ? IC.down : IC.go}</button>${open ? `<div class="xbody">${rankDetail(r)}${swapList(r[0])}${exButtons(r[0])}</div>` : ''}</div>`;
      }).join('');
      b += `</div></section>`;
    });
    return { title: groupName(p.id), body: b };
  }
  function viewExInfo(p) {
    const ex = p.ex;
    const info = exInfo(ex);
    let b = `<div class="tags">${eqTag(info.eq)}</div>`;
    if (info.cue) b += `<p class="cue-top">${h(info.cue)}</p>`;
    b += exButtons(ex);
    const ranks = [];
    D.GROUPS.forEach((g) => { const row = D.RANK[g.id].list.find((r) => r[0] === ex); if (row) ranks.push({ g, row }); });
    if (ranks.length) {
      b += `<section><h2>Where it ranks</h2><div class="list">${ranks.map((x) => `<div class="rank">${disc(x.row[1])}<div><span class="row-title">${x.g.name}</span>${rankDetail(x.row)}</div></div>`).join('')}</div></section>`;
    }
    b += `<section class="swapsec">${swapList(ex)}</section>`;
    return { title: info.n, body: b };
  }

  /* ------------------------------------------------------------------ screen: History */
  function viewHistory() {
    if (!S.entries.length) {
      return { title: 'History', body: `<section class="empty"><h2>Nothing logged yet</h2><p class="muted">After your first workout, every set shows up here by exercise and by day.</p><button class="btn" data-act="tab" data-tab="log">Go to Log</button></section>` };
    }
    const ix = index();
    let b = `<div class="seg two" role="group" aria-label="Show history"><button class="${UI.hist === 'ex' ? 'on' : ''}" data-act="hist" data-mode="ex" aria-pressed="${UI.hist === 'ex'}">By exercise</button><button class="${UI.hist === 'day' ? 'on' : ''}" data-act="hist" data-mode="day" aria-pressed="${UI.hist === 'day'}">By day</button></div>`;
    if (UI.hist === 'ex') {
      const rows = Object.keys(ix.by).map((ex) => { const ss = sessions(ex); return { ex, last: ss[ss.length - 1], n: ss.length }; })
        .sort((a, c) => (a.last.d < c.last.d ? 1 : a.last.d > c.last.d ? -1 : exName(a.ex).localeCompare(exName(c.ex))));
      b += `<div class="list">${rows.map((r) => `<button class="row" data-act="exhist" data-ex="${h(r.ex)}"><span class="row-main"><span class="row-title">${h(exName(r.ex))}</span><span class="row-sub">${fmtDay(r.last.d)}, best set ${h(setLong(topSet(r.last.sets)))}</span></span>${IC.go}</button>`).join('')}</div>`;
    } else {
      const days = Object.keys(ix.days).sort().reverse();
      days.slice(0, UI.daysShown).forEach((d) => {
        const list = ix.days[d];
        const order = [];
        list.forEach((e) => { if (order.indexOf(e.ex) < 0) order.push(e.ex); });
        b += `<section><div class="sec-head"><h2>${fmtDay(d)}</h2><span class="muted">${plural(list.length, 'set')}</span></div><div class="list">${order.map((ex) => `<button class="row" data-act="exhist" data-ex="${h(ex)}"><span class="row-main"><span class="row-title">${h(exName(ex))}</span><span class="chips">${list.filter((e) => e.ex === ex).map(setChip).join('')}</span></span>${IC.go}</button>`).join('')}</div></section>`;
      });
      if (days.length > UI.daysShown) b += `<button class="btn ghost" data-act="more-days">Show older days</button>`;
    }
    return { title: 'History', body: b };
  }

  function niceStep(x) {
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    const f = x / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  /* Progress chart: one line, the best set of each day. */
  function chart(ex) {
    const info = exInfo(ex);
    const all = sessions(ex);
    const bw = all.every((s) => s.sets.every((e) => !e.w));
    const pts = all.slice(-20).map((s) => {
      const e = bw ? s.sets.reduce((a, c) => (c.r > a.r ? c : a), s.sets[0]) : topSet(s.sets);
      return { d: s.d, v: bw ? e.r : e.w, e };
    });
    const unit = bw ? (info.timed ? 'sec' : 'reps') : 'lb';
    const title = bw ? (info.timed ? 'Longest hold each day, seconds' : 'Most reps in one set each day') : 'Top weight each day, lb';
    const W = 400, H = 210, L = 44, R = 20, T = 26, B = 30;
    const vals = pts.map((p) => p.v);
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const step = niceStep(hi > lo ? (hi - lo) / 3 : Math.max(1, hi * 0.05));
    let y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    if (y0 === y1) { y0 = Math.max(0, y0 - step); y1 += step; }
    const X = (i) => (pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1));
    const Y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
    let g = '';
    for (let v = y0; v <= y1 + 1e-9; v += step) {
      const y = Y(v).toFixed(1);
      g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 8}" y="${y}" dy="4" text-anchor="end" class="axis">${fmtW(v)}</text>`;
    }
    const sel = UI.pt != null && pts[UI.pt] ? UI.pt : pts.length - 1;
    const bestI = vals.lastIndexOf(hi);
    let marks = '', hits = '', labels = '';
    pts.forEach((p, i) => {
      const x = X(i).toFixed(1), y = Y(p.v).toFixed(1);
      marks += `<circle cx="${x}" cy="${y}" r="${i === sel ? 7 : 5}" class="pt${i === sel ? ' sel' : ''}"/>`;
      hits += `<circle cx="${x}" cy="${y}" r="20" class="hit" data-act="pt" data-i="${i}" role="button" aria-label="${fmtDay(p.d)}, ${h(setLong(p.e))}"/>`;
      if (i === pts.length - 1 || i === bestI) {
        const anchor = pts.length === 1 ? 'middle' : i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle';
        const dx = anchor === 'end' ? 7 : anchor === 'start' ? -7 : 0;
        labels += `<text x="${(+x + dx).toFixed(1)}" y="${(+y - 13).toFixed(1)}" text-anchor="${anchor}" class="val">${fmtW(p.v)}</text>`;
      }
    });
    const line = pts.length > 1 ? `<polyline points="${pts.map((p, i) => X(i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}" class="line"/>` : '';
    const xl = pts.length === 1
      ? `<text x="${X(0)}" y="${H - 8}" text-anchor="middle" class="axis">${fmtShort(pts[0].d)}</text>`
      : `<text x="${L}" y="${H - 8}" text-anchor="start" class="axis">${fmtShort(pts[0].d)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" class="axis">${fmtShort(pts[pts.length - 1].d)}</text>`;
    const sp = pts[sel];
    const first = pts[0], last = pts[pts.length - 1];
    let summary;
    if (pts.length === 1) summary = 'One day logged so far. Log it on another day and a line appears here.';
    else {
      const diff = Math.round((last.v - first.v) * 100) / 100;
      summary = `${plural(all.length, 'day')} logged. ` + (diff > 0 ? `Up ${fmtW(diff)} ${unit} since ${fmtShort(first.d)}.` : diff < 0 ? `Down ${fmtW(-diff)} ${unit} since ${fmtShort(first.d)}.` : `Same ${bw ? 'best' : 'top weight'} as on ${fmtShort(first.d)}.`);
    }
    return `<section class="chart"><h2>${title}</h2>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}. Latest ${fmtW(last.v)} ${unit} on ${fmtDay(last.d)}.">${g}${line}${marks}${labels}${xl}${hits}</svg>
      <p class="readline"><b>${fmtDay(sp.d)}</b><span>${h(setLong(sp.e))}</span></p>
      <p class="muted">${summary}${all.length > 20 ? ' The chart shows the latest 20 days.' : ''}</p></section>`;
  }
  function viewExHist(p) {
    const ex = p.ex;
    const info = exInfo(ex);
    const ss = sessions(ex);
    let b = '';
    if (!ss.length) {
      b = `<section class="empty"><h2>Nothing logged yet</h2><p class="muted">Sets you log for this exercise show up here.</p></section>`;
    } else {
      b += chart(ex);
      ss.slice().reverse().forEach((s) => {
        b += `<section><div class="sec-head"><h2>${fmtDay(s.d)}</h2><span class="muted">${ago(s.d)}</span></div><div class="list">${s.sets.map((e, i) => `<button class="row set" data-act="edit" data-id="${h(e.id)}"><span class="count">${i + 1}</span><span class="row-main"><span class="row-title">${h(setLong(e))}</span></span><span class="hint">Edit</span></button>`).join('')}</div></section>`;
      });
    }
    b += `<div class="stack"><button class="btn" data-act="open-log" data-ex="${h(ex)}">Log this exercise</button>${info.custom ? `<button class="btn ghost" data-act="rename" data-ex="${h(ex)}">Rename this exercise</button>` : ''}</div>`;
    return { title: info.n, body: b };
  }

  /* ------------------------------------------------------------------ screen: Backup */
  const INSTALL_STEPS = [
    'Open the app’s address in <b>Safari</b> on the iPhone.',
    'Tap the <b>•••</b> button beside the address bar, then <b>Share</b>. If a Share button (a square with an arrow) is already showing, tap that.',
    'Scroll down the list and tap <b>Add to Home Screen</b>.',
    'Leave <b>Open as Web App</b> switched on, then tap <b>Add</b>.',
    'Close Safari. Open <b>Gym Log</b> from the Home Screen, and log from there every time.'
  ];
  function whereText() {
    if (MODE !== 'app') return `<p>Nowhere. This is a preview, so nothing you log here is kept.</p>`;
    if (ENV.ios) {
      return `<p>On this iPhone, inside this Home Screen app's own storage. Nothing is sent to Claude, GitHub or anywhere online.</p>
        <p>Your logs are erased if you delete this app's icon from the Home Screen, or erase the iPhone. Don't count on iPhone or iCloud backups to carry them to a new phone.</p>
        <p><b>Back up now</b> saves a file holding every log. Choose Save to Files and keep it in iCloud Drive. <b>Restore</b> reads that file back in, on this phone or a new one.</p>`;
    }
    return `<p>In this browser on this device, and nowhere else. Nothing is sent to Claude, GitHub or anywhere online.</p>
      <p>Clearing this browser's site data erases the logs. Logs made here do not appear on your iPhone.</p>

  const TABS = { log: viewHome, workouts: viewWorkouts, guide: viewGuide, history: viewHistory, backup: viewBackup };
  const VIEWS = { workout: viewWorkout, log: viewLog, picker: viewPicker, pgroup: viewPGroup, group: viewGroup, exinfo: viewExInfo, exhist: viewExHist, install: viewInstall, sources: viewSources };
  const SHEETS = { swap: sheetSwap, edit: sheetEdit, custom: sheetCustom, rename: sheetRename, legend: sheetLegend, restored: sheetRestored, btext: sheetBackupText, paste: sheetPaste, hatch: sheetHatch, hatch2: sheetHatch2 };

  /* ------------------------------------------------------------------ render */
  function render(how) {
    if (!S) return;
    const y = window.scrollY;
    const sheet = topSheet();
    const sheetHTML = sheet ? `<div class="sheet-bg" data-act="back"><div class="sheet${sheet.fresh ? ' in' : ''}" data-act="noop" role="dialog" aria-modal="true">${SHEETS[sheet.name](sheet)}</div></div>` : '';
    if (sheet) sheet.fresh = false;
    document.documentElement.classList.toggle('locked', !!sheet);
    if (MODE === 'gate') { root.innerHTML = viewGate() + sheetHTML; window.scrollTo(0, how === 'new' ? 0 : y); return; }
    if (S.plan && S.plan.d !== today()) { S.plan = null; save(); }
    const page = topPage();

    const isRoot = !page;

    if (MODE === 'demo') {

        ? `<div class="demo"><span>Just looking, with sample logs. Nothing is saved here.</span><button data-act="to-gate">Set up</button></div>`

  /* ------------------------------------------------------------------ backup and restore */
  function backupObject() {
    return { app: 'gym-log', formatVersion: 1, exportedAt: new Date().toISOString(), sets: S.entries.length, entries: S.entries, custom: S.custom, swapPrefs: S.swapPrefs, prefs: { time: S.prefs.time } };
  }
  function backedUp(msg) {
    S.meta.lastBackupAt = Date.now();
    S.meta.snoozeUntil = 0;
    save();
    render();
    toast(msg);
  }
  function download(text, name) {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 2000);
  }
  function exportBackup() {
    if (MODE !== 'app') { toast('Backups work in the real app, not in this preview'); return; }
    if (!S.entries.length && !S.custom.length) { toast('Nothing to back up yet'); return; }
    const text = JSON.stringify(backupObject());
    const name = 'gym-log-backup-' + stamp(new Date()) + '.json';
    const phone = ENV.ios || ENV.android;
    const canShare = (f) => { try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) { return false; } };
    let file = null;
    if (phone) {
      try { file = new File([text], name, { type: 'application/json' }); } catch (e) { file = null; }
      if (file && !canShare(file)) {
        try { const alt = new File([text], name.replace(/\.json$/, '.txt'), { type: 'text/plain' }); file = canShare(alt) ? alt : null; } catch (e) { file = null; }
      }
    }
    if (file) {
      navigator.share({ files: [file] }).then(
        () => backedUp('Backup made. Keep the file in Files or iCloud Drive.'),
        (err) => {
          if (err && err.name === 'AbortError') toast('Backup cancelled. No file was saved.');
          else { UI.backupText = text; openSheet({ name: 'btext' }); }
        }
      );
      return;
    }
    if (!ENV.ios) {
      try { download(text, name); backedUp('Backup saved to your Downloads folder'); return; } catch (e) { /* fall through */ }
    }
    UI.backupText = text;
    openSheet({ name: 'btext' });
  }
  function mergeBackup(o) {
    const byId = {};
    S.entries.forEach((e) => { byId[e.id] = e; });
    let added = 0, updated = 0, same = 0;
    o.entries.forEach((raw) => {
      if (!validEntry(raw)) return;
      const e = cleanEntry(raw);
      const mine = byId[e.id];
      if (!mine) { S.entries.push(e); byId[e.id] = e; added++; }
      else if (e.m > mine.m) { Object.assign(mine, e); updated++; }
      else same++;
    });
    if (Array.isArray(o.custom)) o.custom.forEach((c) => { if (c && c.id && c.name && !S.custom.some((x) => x.id === String(c.id))) S.custom.push(cleanCustom(c)); });
    if (o.swapPrefs && typeof o.swapPrefs === 'object') {
      Object.keys(o.swapPrefs).forEach((k) => { if (!S.swapPrefs[k] && D.EX[k] && D.EX[k].sw.indexOf(o.swapPrefs[k]) >= 0) S.swapPrefs[k] = o.swapPrefs[k]; });
    }
    return { added, updated, same };
  }
  function importText(text) {
    if (MODE !== 'app') { toast('Restore works in the real app, not in this preview'); return false; }
    let o = null;
    try { o = JSON.parse(String(text).trim()); } catch (e) { o = null; }
    if (!o || o.app !== 'gym-log' || !Array.isArray(o.entries)) { toast('That is not a Gym Log backup'); return false; }
    UI.restored = mergeBackup(o);
    save();

  }
  function fileInput() {

      const rd = new FileReader();
      rd.onload = () => { importText(String(rd.result || '')); el.value = ''; };
      rd.onerror = () => { toast('Could not read that file'); el.value = ''; };

    return el;
  }

  /* ------------------------------------------------------------------ actions */
  let held = false, holdTimer = null, holdRepeat = null;
  function stepOnce(el) {
    const inp = document.getElementById(el.dataset.step);
    if (!inp) return;
    let v = num(inp.value, 9999) + parseFloat(el.dataset.delta);
    if (v < 0) v = 0;
    inp.value = v ? fmtW(v) : '';

  });
  ['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach((t) => document.addEventListener(t, stopHold, true));

  const ACT = {
    noop() {},
    back() { back(); },
    tab(el) { NAV.tab = el.dataset.tab; UI.pt = null; render('new'); if (NAV.tab === 'backup') checkOffline(); },
    'toast-act'() { const fn = TOAST_FN; hideToast(); if (fn) fn(); },
