    'to-gate'() { MODE = 'gate'; NAV.stack.length = 0; render('new'); },
    hatch() { openSheet({ name: 'hatch' }); },
    'hatch-yes'() { openSheet({ name: 'hatch2' }); },
    'force-app'() {
      try { localStorage.setItem(HOME_FLAG, '1'); } catch (e) { /* keep going */ }

      loadSaved().then(() => { render('new'); registerSW(); });
    },

    'go-workouts'() { NAV.tab = 'workouts'; render('new'); },
    picker() { UI.q = ''; push({ name: 'picker' }); },
    finish() {
      const n = (index().days[today()] || []).length;
      S.plan = null;
      S.rest = null;
      save();
      render('new');
      toast(n ? `Workout finished. ${plural(n, 'set')} saved today.` : 'Workout cleared');
    },
    'backup-later'() { S.meta.snoozeUntil = Date.now() + 3 * 86400000; save(); render(); },
    'hide-qr'() { S.prefs.hideQR = 1; save(); render(); },

    workout(el) { push({ name: 'workout', id: el.dataset.id }); },
    time(el) { S.prefs.time = +el.dataset.t; save(); render(); },
    start() {
      const p = topPage();
      if (!p || p.name !== 'workout') return;
      const w = workout(p.id);
      const time = timeFor(w);
      S.plan = { d: today(), wid: w.id, time, title: `${w.name}, ${time} min`, items: plannedItems(w, time) };
      S.rest = null;
      save();
      NAV.tab = 'log';
      SCROLL[0] = 0;
      back();
    },
    swap(el) { openSheet({ name: 'swap', ctx: el.dataset.ctx, orig: el.dataset.orig, idx: +el.dataset.idx }); },
    'swap-pick'(el) {
      const sh = topSheet();
      if (!sh) return;
      const choice = el.dataset.ex;
      if (choice === sh.orig) delete S.swapPrefs[sh.orig]; else S.swapPrefs[sh.orig] = choice;
      if (sh.ctx === 'plan' && S.plan && S.plan.items[sh.idx]) {
        const it = S.plan.items[sh.idx];
        const was = it.ex;
        it.ex = choice;
        it.orig = sh.orig;
        it.reps = exInfo(choice).timed ? '30–40' : (exInfo(was).timed ? '10–15' : it.reps);
        const below = NAV.stack[NAV.stack.length - 2];
        if (below && below.name === 'log' && below.ex === was) { below.ex = choice; UI.log = null; }
      }
      save();
      back();
    },
    'plan-remove'() {
      const sh = topSheet();
      if (sh && S.plan && S.plan.items[sh.idx]) { S.plan.items.splice(sh.idx, 1); save(); }
      back();
    },

    'open-log'(el) { UI.log = null; UI.cue = false; push({ name: 'log', ex: el.dataset.ex }); },
    cue() { UI.cue = true; render('new'); },
    next(el) {
      const p = topPage();
      if (p && p.name === 'log') { p.ex = el.dataset.ex; UI.log = null; UI.cue = false; render('new'); }
    },
    step(el) { if (held) { held = false; return; } stepOnce(el); },
    'log-set'() {
      const p = topPage();
      if (!p || p.name !== 'log' || !UI.log) return;
      const info = exInfo(p.ex);
      const w = Math.round(num(UI.log.w, 2000) * 100) / 100;
      const r = Math.round(num(UI.log.r, 9999));
      if (!r) { toast(info.timed ? 'Set the seconds first' : 'Set the reps first'); return; }
      if (!w && !info.bw) { toast('Set the weight first'); return; }
      const now = Date.now();
      const before = (index().by[p.ex] || []).slice();
      const e = { id: uid(), ex: p.ex, w, r, t: now, d: ymd(now), m: now };
      S.entries.push(e);
      const item = planItem(p.ex);
      const rest = item ? item.rest : 90;
      S.rest = { ex: p.ex, until: now + rest * 1000, total: rest };
      save();
      UI.log = { ex: p.ex, w: w ? fmtW(w) : '', r: String(suggest(p.ex).r) };
      render();
      const note = bestNote(e, before);
      if (note) toast(note);
    },
    'rest-clear'() { S.rest = null; save(); tickRest(); },
    edit(el) {
      const e = S.entries.find((x) => x.id === el.dataset.id);
      if (!e) return;
      UI.edit = { id: e.id, w: e.w ? fmtW(e.w) : '', r: String(e.r), d: e.d };
      openSheet({ name: 'edit' });
    },
    'edit-save'() {
      const u = UI.edit;
      const e = u && S.entries.find((x) => x.id === u.id);
      if (!e) { back(); return; }
      const info = exInfo(e.ex);
      const w = Math.round(num(u.w, 2000) * 100) / 100;
      const r = Math.round(num(u.r, 9999));
      if (!r) { toast(info.timed ? 'Enter the seconds' : 'Enter the reps'); return; }
      if (!w && !info.bw) { toast('Enter the weight'); return; }
      const d = /^\d{4}-\d\d-\d\d$/.test(u.d) && u.d <= today() ? u.d : e.d;
      if (d !== e.d) { e.t = dateOf(d).getTime() + (e.t % 3600000); e.d = d; }
      e.w = w;
      e.r = r;
      e.m = Date.now();
      save();
      back();
      toast('Set updated');
    },
    'edit-delete'() {
      const u = UI.edit;
      const i = u ? S.entries.findIndex((x) => x.id === u.id) : -1;
      if (i < 0) { back(); return; }
      const gone = S.entries.splice(i, 1)[0];
      save();
      back();
      toast('Set deleted', { label: 'Undo', fn() { if (!S.entries.some((x) => x.id === gone.id)) { S.entries.push(gone); save(); render(); } } });
    },

    pgroup(el) { push({ name: 'pgroup', id: el.dataset.id }); },
    'pick-ex'(el) { pick(el.dataset.ex); },
    'custom-new'() { UI.custom = { name: UI.q.trim(), group: (topPage() && topPage().name === 'pgroup') ? topPage().id : '' }; openSheet({ name: 'custom' }); },
    'custom-save'() {
      const name = (UI.custom.name || '').trim().replace(/\s+/g, ' ');
      if (!name) { toast('Type a name first'); return; }
      const lower = name.toLowerCase();
      let id = Object.keys(D.EX).find((k) => D.EX[k].n.toLowerCase() === lower);
      if (!id) { const c = S.custom.find((x) => x.name.toLowerCase() === lower); if (c) id = c.id; }
      if (!id) { id = 'c_' + uid(); S.custom.push(cleanCustom({ id, name, group: UI.custom.group })); save(); }
      pick(id);
    },
    rename(el) { UI.rename = exName(el.dataset.ex); openSheet({ name: 'rename', ex: el.dataset.ex }); },
    'rename-save'(el) {
      const c = S.custom.find((x) => x.id === el.dataset.ex);
      const name = (UI.rename || '').trim().replace(/\s+/g, ' ');
      if (!name) { toast('Type a name first'); return; }
      if (c) { c.name = name.slice(0, 60); save(); }
      back();
    },

    group(el) { UI.open = null; push({ name: 'group', id: el.dataset.id }); },
    xtoggle(el) { UI.open = UI.open === el.dataset.ex ? null : el.dataset.ex; render(); },
    exinfo(el) { push({ name: 'exinfo', ex: el.dataset.ex }); },
    legend() { openSheet({ name: 'legend' }); },

    hist(el) { UI.hist = el.dataset.mode; render(); },
    'more-days'() { UI.daysShown += 30; render(); },
    exhist(el) { UI.pt = null; push({ name: 'exhist', ex: el.dataset.ex }); },
    pt(el) { UI.pt = +el.dataset.i; render(); },

    export() { exportBackup(); },
    import() { if (MODE !== 'app') { toast('Restore works in the real app, not in this preview'); return; } fileInput().click(); },
    paste() { openSheet({ name: 'paste' }); },
    'paste-go'() { const el = document.getElementById('ptext'); if (!el || !el.value.trim()) { toast('Paste the backup text first'); return; } importText(el.value); },
    'copy-backup'() {
      const el = document.getElementById('btext');
      const done = () => backedUp('Backup text copied. Paste it into a note and keep it.');
      const manual = () => { try { el.focus(); el.select(); if (document.execCommand('copy')) done(); else toast('Select the text and copy it by hand'); } catch (e) { toast('Select the text and copy it by hand'); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(UI.backupText).then(done, manual); else manual();
    },
    sources() { push({ name: 'sources' }); },
    install() { push({ name: 'install' }); }
  };

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (fn) fn(el, ev);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && topSheet()) { back(); return; }
    if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('readout')) ev.target.blur();
  });
  function onInput(ev) {
    const el = ev.target;
    const k = el.dataset && el.dataset.in;
    if (!k) return;
    if (k === 'log-w' && UI.log) UI.log.w = el.value;
    else if (k === 'log-r' && UI.log) UI.log.r = el.value;
    else if (k === 'ed-w' && UI.edit) UI.edit.w = el.value;
    else if (k === 'ed-r' && UI.edit) UI.edit.r = el.value;
    else if (k === 'ed-d' && UI.edit) UI.edit.d = el.value;
    else if (k === 'c-name' && UI.custom) UI.custom.name = el.value;
    else if (k === 'c-group' && UI.custom) UI.custom.group = el.value;
    else if (k === 'rename') UI.rename = el.value;
    else if (k === 'q') { UI.q = el.value; const box = document.getElementById('pick-results'); if (box) box.innerHTML = pickerResults(); }
  }
  document.addEventListener('input', onInput);
  /* Pickers (date, muscle list) report through "change". Text boxes must not: their change fires when
     a result row is tapped, and redrawing the list at that moment would swallow the tap. */
  document.addEventListener('change', (ev) => { const t = ev.target; if (t.tagName === 'SELECT' || t.type === 'date') onInput(ev); });
  document.addEventListener('focusin', (ev) => {
    const el = ev.target;
    if (el.classList && el.classList.contains('readout')) setTimeout(() => { try { el.select(); } catch (e) { /* ignore */ } }, 0);
  });

  /* Another tab of the same browser changed the logs: take the newer copy. */
  window.addEventListener('storage', (e) => {
    if (MODE !== 'app' || !S || e.key !== KEY || !e.newValue) return;
    const o = parse(e.newValue);
    if (o && o.rev > S.rev) { S = o; IDX = null; render(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !S) return;
    if (MODE === 'app') {
      let raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
      const o = parse(raw);
      if (o && o.rev > S.rev) { S = o; IDX = null; } else if (!o && S.entries.length) writeOut();
    }
    if (!topSheet()) render();
  });

  /* ------------------------------------------------------------------ offline support */
  function checkOffline() {
    if (!window.caches || MODE !== 'app') return;
    caches.match('./', { ignoreSearch: true }).then((r) => {
      const ok = !!r;
      if (ok !== HEALTH.offline) { HEALTH.offline = ok; if (NAV.tab === 'backup' && !NAV.stack.length) render(); }
    }).catch(() => {});
  }
  function registerSW() {
    if (MODE !== 'app' || !ENV.web || !('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { checkOffline(); setTimeout(checkOffline, 4000); }).catch(() => {});
  }

  /* ------------------------------------------------------------------ start */
  async function boot() {
    if (ENV.embedded || ENV.demoFlag || window.__GYMLOG_PREVIEW) MODE = 'demo';
    else if (ENV.gateFlag || (ENV.ios && !ENV.standalone && !getFlag())) MODE = 'gate';
    if (HIST) { try { history.replaceState({ d: 0 }, ''); } catch (e) { HIST = false; } }
    if (MODE === 'demo') S = demoState();
    else if (MODE === 'gate') S = fresh();
    else await loadSaved();
    render('new');
    registerSW();
    checkOffline();
  }
  boot();

  /* Test hook: only the automated checks use this. */
  window.__gymlog = { get state() { return S; }, get mode() { return MODE; }, health: HEALTH, env: ENV, importText, backupObject, ymd };
})();

</script>
</body>
